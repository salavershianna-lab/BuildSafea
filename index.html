<!DOCTYPE html>
<html>

<head>
    <title>BuildSafe DIHS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="welcome-screen">

        <div class="welcome-box">

            <img src="dihs-logo.png" alt="DIHS Logo" class="school-logo">

            <h1>Welcome to BuildSafe DIHS</h1>

            <p class="subtitle">
                Digital Classroom Inventory System
            </p>

            <div class="account-option">
                <h2>SCHOOL HEAD</h2>

                <input type="text" placeholder="Enter Account Number">

                <button onclick="schoolHeadLogin()">
                    ENTER AS SCHOOL HEAD
                </button>
            </div>

            <div class="account-option">
                <h2>TEACHER / ROOM ADVISER</h2>

                <input type="text" placeholder="Enter Account Number">

                <button onclick="teacherAdviserLogin()">
                    ENTER AS TEACHER / ROOM ADVISER
                </button>
            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
