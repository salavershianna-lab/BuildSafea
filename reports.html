<!DOCTYPE html>
<html>

<head>
    <title>BuildSafe DIHS - Maintenance Reports</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h1>BuildSafe DIHS</h1>

        <p>
            Digital Classroom Inventory System
        </p>

        <button onclick="Dashboard()">Dashboard</button>
        <button onclick="Classroom()">Classroom</button>
        <button onclick="Reports()">Reports</button>
        <button onclick="logout()">Logout</button>

    </aside>


    <main class="main-content">

        <h1>Maintenance Reports</h1>

        <p>
            Receive and review classroom maintenance reports.
        </p>


        <div class="Report-box">

            <div class="report-header">

                <h2>Reports</h2>

                <span
                    id="newReportBadge"
                    class="new-report-badge">
                    0 New Updates
                </span>

            </div>


            <!-- ROOM 18 -->

            <button
                class="Room-Report"
                onclick="openReport('18')">

                <div>

                    <h2>Room 18</h2>

                    <p>Building 17</p>

                </div>

                <span
                    class="new-update"
                    id="newUpdate18"
                    style="display: none;">
                    NEW UPDATE
                </span>

            </button>


            <!-- ROOM 19 -->

            <button
                class="Room-Report"
                onclick="openReport('19')">

                <div>

                    <h2>Room 19</h2>

                    <p>Building 17</p>

                </div>

                <span
                    class="new-update"
                    id="newUpdate19"
                    style="display: none;">
                    NEW UPDATE
                </span>

            </button>


            <!-- ROOM 20 -->

            <button
                class="Room-Report"
                onclick="openReport('20')">

                <div>

                    <h2>Room 20</h2>

                    <p>Building 17</p>

                </div>

                <span
                    class="new-update"
                    id="newUpdate20"
                    style="display: none;">
                    NEW UPDATE
                </span>

            </button>


        </div>

    </main>

</div>


<script src="app.js"></script>

</body>

</html>
