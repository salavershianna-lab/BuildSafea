<!DOCTYPE html>
<html>

<head>

    <title>BuildSafe DIHS - School Head Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="head-style.css">

</head>


<body>


<div class="dashboard">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>BuildSafe DIHS</h2>

        <p>
            Digital Classroom Inventory System
        </p>


        <button onclick="Dashboard()">
            Dashboard
        </button>

        <button onclick="Classroom()">
            Classroom
        </button>

        <button onclick="Reports()">
            Reports
        </button>

        <button onclick="logout()">
            Logout
        </button>

    </aside>



    <!-- MAIN CONTENT -->

    <main class="main-content">


        <!-- WELCOME -->

        <section class="search-box">

            <h1>
                Welcome to BuildSafe DIHS, School Head!
            </h1>

            <p>
                Manage and monitor all classroom inventories
                and maintenance reports.
            </p>


            <div class="search-bar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search building or room..."
                >

                <button onclick="searchHeadDashboard()">
                    Search
                </button>

            </div>

        </section>



        <!-- CLASSROOMS -->

        <section
            class="Classroom"
            id="roomsSection"
        >

            <h2>
                Classrooms
            </h2>


            <div class="classroom-box">


                <!-- ROOM 18 -->

                <button
                    class="room-card"
                    onclick="openInventory('18')"
                >

                    <h3>
                        Room 18
                    </h3>

                    <p>
                        Building 17
                    </p>

                    <strong>
                        View Classroom
                    </strong>

                    <span class="room-info">
                        Inventory • Condition • Reports
                    </span>

                </button>



                <!-- ROOM 19 -->

                <button
                    class="room-card"
                    onclick="openInventory('19')"
                >

                    <h3>
                        Room 19
                    </h3>

                    <p>
                        Building 17
                    </p>

                    <strong>
                        View Classroom
                    </strong>

                    <span class="room-info">
                        Inventory • Condition • Reports
                    </span>

                </button>



                <!-- ROOM 20 -->

                <button
                    class="room-card"
                    onclick="openInventory('20')"
                >

                    <h3>
                        Room 20
                    </h3>

                    <p>
                        Building 17
                    </p>

                    <strong>
                        View Classroom
                    </strong>

                    <span class="room-info">
                        Inventory • Condition • Reports
                    </span>

                </button>


            </div>

        </section>


    </main>


</div>


<!-- ONE JAVASCRIPT FILE ONLY -->

<script src="app.js"></script>

</body>

</html>
