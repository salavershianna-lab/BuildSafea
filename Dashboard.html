<!DOCTYPE html>
<html>

<head>
    <title>BuildSafe DIHS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <h2>BuildSafe DIHS</h2>

            <p>
                Digital Classroom Inventory System
            </p>

            <button onclick="Dashboard()">
                Dashboard
            </button>

            <button onclick="Classroom()">
                Classroom
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </aside>


        <main class="main-content">

            <div class="search-box">

                <h1>
                    Welcome to BuildSafe DIHS, Teacher / Room Adviser!
                </h1>

                <p>
                    Find Your Classroom
                </p>

                <div class="search-bar">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search building or rooms..."
                    >

                    <button onclick="searchDashboard()">
                        Search
                    </button>

                </div>

            </div>


            <div class="Classroom">

                <div class="classroom-box">

                    <button
                        class="room-card"
                        onclick="openInventory('18')"
                    >

                        <h3>
                            Room 18
                        </h3>

                        <p>
                            Building 17
                        </p>

                        <strong>
                            Priority: High
                        </strong>

                    </button>


                    <button
                        class="room-card"
                        onclick="openInventory('19')"
                    >

                        <h3>
                            Room 19
                        </h3>

                        <p>
                            Building 17
                        </p>

                        <strong>
                            Priority: Low
                        </strong>

                    </button>


                    <button
                        class="room-card"
                        onclick="openInventory('20')"
                    >

                        <h3>
                            Room 20
                        </h3>

                        <p>
                            Building 17
                        </p>

                        <strong>
                            Priority: Low
                        </strong>

                    </button>

                </div>

            </div>

        </main>

    </div>


    <script src="app.js"></script>

</body>

</html>
